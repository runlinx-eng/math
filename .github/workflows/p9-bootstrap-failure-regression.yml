name: P9 learning module failure fallback
on:
  # Each merged main commit gets its own stopped-origin regression artifact.
  push:
    branches: [main]
  pull_request:
    paths:
      - 'dist/learn.html'
      - 'dist/sw.js'
      - 'dist/sw-client.js'
      - 'dist/local-runtime.js'
      - 'dist/learning/three-view-runtime.js'
      - 'tests/p9-three-view-lazy-browser.cjs'
      - 'tests/p9-bootstrap-failure-browser.cjs'
      - 'tests/helpers/p9-browser-diagnostics.cjs'
      - 'tests/helpers/p9-cdp-lifecycle-diagnostics.cjs'
      - 'tests/p9-bootstrap-failure-artifact.test.mjs'
      - 'tests/p9-learning-bootstrap-error-banner.test.mjs'
      - '.github/workflows/p9-bootstrap-failure-regression.yml'
      - '.github/ci-probes/install-cjk-font.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-failure-fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matching Chromium runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Detect Chinese fonts
        id: chinese_fonts
        run: |
          if fc-list :lang=zh-cn family | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore immutable CJK package cache
        if: steps.chinese_fonts.outputs.present == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.cache/math-tree/fonts-wqy-microhei_0.2.0-beta-3.1_all.deb
          key: wqy-ubuntu24-0.2.0-beta-3.1-58d0a29af79ce1fc5c63b4276065f0fce27decf6839835f3f9c2e68d9f84ca20-v1
      - name: Install Chinese font fallback
        if: steps.chinese_fonts.outputs.present == 'false'
        run: |
          bash .github/ci-probes/install-cjk-font.sh
          fc-cache -f
      - name: Verify Chinese font
        run: |
          fc-list :lang=zh-cn family | grep -q . || { echo "Missing CJK fonts"; exit 1; }
          fc-match -f 'Fallback CJK font: %{family} [%{file}]\n' 'sans-serif:lang=zh-cn'
      - name: Verify browser probe syntax and failure banner contract
        run: |
          node --check tests/p9-bootstrap-failure-browser.cjs
          node --test tests/p9-learning-bootstrap-error-banner.test.mjs tests/p9-bootstrap-failure-artifact.test.mjs
      - name: Real Chromium healthy and deliberately incomplete offline module graph
        run: node tests/p9-bootstrap-failure-browser.cjs
      - name: Retain real Chromium screenshots and error evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9-bootstrap-error-fallback-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/p9-bootstrap-failure/
          if-no-files-found: error
