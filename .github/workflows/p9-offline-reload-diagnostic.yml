name: P9 offline reload diagnostic

on:
  pull_request:
    paths:
      - 'tests/p9-offline-reload-diagnostic.cjs'
      - '.github/workflows/p9-offline-reload-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-reload-diagnostic:
    # The current failure investigation only. This is not a Required/P10 gate.
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'diagnostic/issue-172-offline-reload') ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'diagnostic/issue-172-offline-reload')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the unchanged Chromium version
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Diagnose the original stopped-origin scene
        env:
          # Preserve Chromium subprocess stdout/stderr in the artifact console.
          DEBUG: pw:browser
        shell: bash
        run: |
          node --check tests/p9-offline-reload-diagnostic.cjs
          mkdir -p verification/p9-offline-reload-diagnostic
          node tests/p9-offline-reload-diagnostic.cjs 2>&1 | tee verification/p9-offline-reload-diagnostic/console.log
      - name: Preserve the first failure and all preceding observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9-offline-reload-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/p9-offline-reload-diagnostic/
          if-no-files-found: error
