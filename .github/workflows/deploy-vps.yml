name: Deploy Math Explorer preview

# Manual-only preview releases: merging to main or a successful CI never publishes.
# A separate, explicit workflow_dispatch with confirm_deploy=true is required.
on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Confirm this one-time deployment to the VPS
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Prevent overlapping releases and manual rollbacks from racing.
concurrency:
  group: math-preview-release
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_deploy == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # This workflow runs only on explicitly confirmed, manual main dispatches.
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Only publish a fully checked, current main commit
        id: release_gate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid release SHA"; exit 1; }
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$main_sha"
          if [[ "$main_sha" != "$RELEASE_SHA" ]]; then
            echo "Skipping superseded run: $RELEASE_SHA (current main: $main_sha)"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Validate deployment settings
        if: steps.release_gate.outputs.eligible == 'true'
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_WEB_ROOT: ${{ vars.VPS_WEB_ROOT }}
          VPS_URL: ${{ vars.VPS_URL }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_WEB_ROOT"
          test -n "$VPS_URL"

      - name: Prepare pinned SSH access
        if: steps.release_gate.outputs.eligible == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps_deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/vps_known_hosts"
          chmod 600 "$RUNNER_TEMP/vps_deploy_key" "$RUNNER_TEMP/vps_known_hosts"
          echo "VPS_SSH_KEY_FILE=$RUNNER_TEMP/vps_deploy_key" >> "$GITHUB_ENV"
          echo "VPS_KNOWN_HOSTS_FILE=$RUNNER_TEMP/vps_known_hosts" >> "$GITHUB_ENV"

      - name: Deploy current main atomically and verify HTTPS health
        if: steps.release_gate.outputs.eligible == 'true'
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_WEB_ROOT: ${{ vars.VPS_WEB_ROOT }}
          VPS_URL: ${{ vars.VPS_URL }}
        run: |
          set -euo pipefail
          # A newer merge may arrive while SSH prerequisites are prepared.
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$main_sha"
          if [[ "$main_sha" != "$RELEASE_SHA" ]]; then
            echo "Skipping superseded release $RELEASE_SHA; main is $main_sha"
            exit 0
          fi
          bash scripts/deploy-vps.sh
