name: P9 fractioncase startup diagnostic

on:
  pull_request:
    paths:
      - 'tests/p9-fractioncase-startup-diagnostic.cjs'
      - 'tests/helpers/p9-startup-observer.cjs'
      - '.github/workflows/p9-fractioncase-startup-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fractioncase-startup-diagnostic:
    # Preserve the failed main and Required run. This does not replace a gate.
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'diagnostic/issue-180-fractioncase-startup') ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'diagnostic/issue-180-fractioncase-startup')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MATH_BROWSER_REQUIRED: 'true'
      MATH_BROWSER_GROUP: evidence-fractioncase
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the unchanged Required runtime and CJK fonts
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          if ! fc-list :lang=zh-cn family | grep -q .; then
            sudo apt-get update -qq -o Acquire::Retries=3
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-noto-cjk
            fc-cache -f >/dev/null
          fi
          fc-list :lang=zh-cn family | grep -q . || { echo "Missing CJK fonts"; exit 1; }
      - name: Run the complete original fractioncase path with passive observations
        env:
          DEBUG: pw:browser
        shell: bash
        run: |
          node --check tests/helpers/p9-startup-observer.cjs
          node --check tests/p9-fractioncase-startup-diagnostic.cjs
          mkdir -p verification/p9-fractioncase-adapter
          fc-list :lang=zh-cn family > verification/p9-fractioncase-adapter/cjk-fonts.txt
          python3 -m http.server 43827 --directory dist > /tmp/math-http.log 2>&1 &
          browser_server_pid=$!
          trap 'kill "$browser_server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:43827/ >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat /tmp/math-http.log
            echo "Local preview server did not become ready."
            exit 1
          fi
          node tests/p9-fractioncase-startup-diagnostic.cjs 2>&1 | tee verification/p9-fractioncase-adapter/startup-diagnostic-console.log
      - name: Preserve the first failure and all preceding original math evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9-fractioncase-startup-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/p9-fractioncase-adapter/
          if-no-files-found: error
          compression-level: 6
          overwrite: false
