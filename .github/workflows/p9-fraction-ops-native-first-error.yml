name: P9 authentic B17 startup native first-error
on:
  pull_request:
    paths:
      - 'tests/p9-fraction-operations-adapter-browser.cjs'
      - 'tests/helpers/p9-issue180-reload-probe.cjs'
      - 'tests/p9-issue180-reload-probe.test.cjs'
      - '.github/workflows/p9-fraction-ops-native-first-error.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unchanged-fraction-operations-and-native-failure-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original mathematics and diagnostic syntax
        run: |
          node --check tests/p9-fraction-operations-adapter-browser.cjs
          node --check tests/helpers/p9-issue180-reload-probe.cjs
          node --test tests/p9-issue180-reload-probe.test.cjs
          node --test tests/p9-fraction-operations-evidence-adapter.test.mjs
      - name: Install the existing Chromium runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          if ! fc-list :lang=zh-cn family | grep -q .; then
            sudo apt-get update -qq -o Acquire::Retries=3
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-noto-cjk
            fc-cache -f >/dev/null
          fi
          fc-list :lang=zh-cn family | grep -q .
      - name: Run original real fraction-operations sequence without retry or altered timeout
        run: node tests/p9-fraction-operations-adapter-browser.cjs
      - name: Retain full mathematics, first-error, CDP and storage evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9-fraction-operations-native-first-error
          path: verification/p9-fraction-operations-adapter/
          if-no-files-found: warn
