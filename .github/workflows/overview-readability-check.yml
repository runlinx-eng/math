name: Math Tree overview checks

# Browser regressions run once through the mandatory required-checks job.

on:
  pull_request:
    paths:
      - 'dist/spatial-*.js'
      - 'dist/space.js'
      - 'dist/grade-progression-model.js'
      - 'dist/grade-node-filter.js'
      - 'dist/data/grade-panorama-lite.json'
      - 'scripts/build_grade_panorama_lite.mjs'
      - 'dist/data/grade-progression.json'
      - 'dist/space.css'
      - 'dist/index.html'
      - 'tests/spatial-overview.test.mjs'
      - 'tests/spatial-overview-structure.test.mjs'
      - 'tests/spatial-overview-browser.cjs'
      - 'tests/spatial-focus-transition-browser.cjs'
      - 'tests/spatial-focus-semantics-browser.cjs'
      - 'tests/spatial-focus-filter-browser.cjs'
      - 'tests/spatial-guide-inplace-browser.cjs'
      - 'tests/spatial-unified-map-browser.cjs'
      - 'tests/spatial-theme-overview-browser.cjs'
      - 'tests/grade-progression-overview.test.mjs'
      - 'tests/grade-node-filter.test.mjs'
      - 'tests/grade-progression-overview-browser.cjs'
      - 'docs/grade-progression/DATA-ADAPTER.md'
      - 'tests/spatial-local-focus-browser.cjs'
      - 'tests/learning-workspace-browser.cjs'
      - 'dist/learning/learn.css'
      - 'dist/learning/learn.js'
      - 'dist/learning/thinking-feedback.js'
      - 'tests/thinking-feedback.test.mjs'
      - 'tests/p9-thinking-feedback-browser.cjs'
      - 'AGENTS.md'
      - 'docs/DEVELOPMENT-WORKFLOW.md'
      - 'docs/spatial-learning/INTERACTION-RULES.md'
      - 'docs/language/**'
      - 'README.md'
      - 'tests/spatial-focus-filter.test.mjs'
      - 'tests/spatial-exploration.test.mjs'
      - '.github/workflows/overview-readability-check.yml'
  workflow_dispatch:

# Cancel superseded runs for the same PR, without cancelling another PR or deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  math-structure-and-ui-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check modified browser module syntax
        run: |
          node --check dist/spatial-scene.js
          node --check dist/spatial-relationship.js
          node --check dist/spatial-model.js
          node --check dist/space.js
          node --check dist/learning/learn.js
          node --check dist/spatial-focus-filter.js
          node --check dist/grade-progression-model.js
          node --check scripts/build_grade_panorama_lite.mjs
          node scripts/build_grade_panorama_lite.mjs --check
          node --check dist/grade-node-filter.js
      - name: Check relationship and grade observation data
        run: node --test tests/spatial-relationship.test.mjs tests/spatial-overview.test.mjs tests/spatial-overview-structure.test.mjs tests/spatial-focus-filter.test.mjs tests/grade-progression-model.test.mjs tests/grade-progression-overview.test.mjs tests/grade-node-filter.test.mjs tests/spatial-exploration.test.mjs
