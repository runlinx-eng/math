name: Issue 341 source-only preintegration lock

on:
  pull_request:
    paths:
      - 'scripts/issue341-preintegration-source-lock.mjs'
      - '.github/workflows/issue-341-preintegration-source-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-lock-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit original 365 immutable source positions; no browser or math tests
        run: |
          set -euo pipefail
          node --check scripts/issue341-preintegration-source-lock.mjs
          node scripts/issue341-preintegration-source-lock.mjs
      - name: Validate isolation and compare with unchanged approved A813
        if: success()
        run: |
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('verification/issue341-preintegration-source-lock')
          result=json.loads((root/'results.json').read_text())
          proposal=json.loads((root/'UNAPPROVED-proposed-manifest.json').read_text())
          assert result['errors']==[],result['errors'][:4]
          assert result['candidatePositions']==result['verifiedPositions']==365
          assert result['frozenCandidateFamilies']==113
          assert result['currentApprovedManifest']==813
          assert result['groupCounts']=={'P007':30,'P009':27,'B':308}
          assert proposal['status']=='NOT_FORMAL_A_APPROVED'
          assert len(proposal['rows'])==365
          assert len({(r['sessionId'],r['index']) for r in proposal['rows']})==365
          assert result['approvedManifestModified'] is False
          assert result['candidateRuntimeRegistered'] is False
          assert result['newStrictA']==0
          print('SOURCE_LOCK_ONLY_PASS: 365 distinct original positions, no admission')
          PY
      - name: Archive preintegration preflight and expressly unapproved proposal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-341-source-lock-only
          path: verification/issue341-preintegration-source-lock/
          retention-days: 7
          if-no-files-found: warn
