name: P9 evidence-expansion startup diagnostic

on:
  pull_request:
    paths:
      - 'tests/p9-mature-startup-diagnostic.cjs'
      - 'tests/p9-mature-expansion-startup-diagnostic.cjs'
      - 'tests/helpers/p9-mature-startup-observer.cjs'
      - '.github/workflows/p9-mature-startup-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mature-startup-diagnostic:
    # Preserve the original PR169 failure and all original tests. This diagnostic
    # observes the original complete four-command group; it is not a Required gate.
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'diagnostic/issue-180-mature-startup' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'diagnostic/issue-180-mature-startup')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MATH_BROWSER_REQUIRED: 'true'
      MATH_BROWSER_GROUP: evidence-expansion
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the unchanged Required runtime and CJK fonts
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          if ! fc-list :lang=zh-cn family | grep -q .; then
            sudo apt-get update -qq -o Acquire::Retries=3
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-noto-cjk
            fc-cache -f >/dev/null
          fi
          fc-list :lang=zh-cn family | grep -q . || { echo "Missing CJK fonts"; exit 1; }
      - name: Run the original complete evidence-expansion command order
        shell: bash
        run: |
          node --check tests/helpers/p9-mature-startup-observer.cjs
          node --check tests/p9-mature-expansion-startup-diagnostic.cjs
          node --check tests/p9-mature-startup-diagnostic.cjs
          mkdir -p verification/p9-mature-startup-diagnostic
          fc-list :lang=zh-cn family > verification/p9-mature-startup-diagnostic/cjk-fonts.txt
          python3 -m http.server 43827 --directory dist > /tmp/math-http.log 2>&1 &
          browser_server_pid=$!
          trap 'kill "$browser_server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:43827/ >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat /tmp/math-http.log
            echo "Local preview server did not become ready."
            exit 1
          fi
          node tests/p9-mature-startup-diagnostic.cjs 2>&1 | tee verification/p9-mature-startup-diagnostic/console.log
      - name: Preserve every actual command and the first native failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9-mature-startup-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification/p9-mature-startup-diagnostic/
            verification/p9-mature-expansion/
            verification/p9-route-adapter/
            verification/p9-fraction-order-adapter/
            verification/p9-fraction-operations-adapter/
          if-no-files-found: error
          compression-level: 6
          overwrite: false
