      - name: Archive evidence audit source-derived report
        if: ${{ failure() || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: learning-evidence-audit-${{ github.run_attempt }}
          path: verification/learning-evidence-audit/
          if-no-files-found: warn

      - name: Check deployment script syntax
        run: bash -n scripts/deploy-vps.sh scripts/rollback-vps.sh

      - name: Preserve Node audit and inventory evidence
        if: ${{ failure() || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: math-required-checks-node-evidence-${{ github.run_attempt }}
          path: |
            verification/learning-node-audit/
            verification/p7-d3/
            verification/p7-d7/coverage.json
            verification/ci-shadow-plan/
          if-no-files-found: warn

  smoke-checks:
    name: smoke-checks
    needs: plan-checks
    if: ${{ needs.plan-checks.outputs.run_smoke == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight real Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Verify startup, 3D state isolation and V2 backup safety
        shell: bash
        run: |
          python3 -m http.server 43827 --directory dist > /tmp/math-smoke-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:43827/ >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then cat /tmp/math-smoke-http.log; exit 1; fi
          node tests/p9-three-view-lazy-browser.cjs
          node tests/p10-backup-safety-browser.cjs
      - name: Save smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: math-smoke-failure-${{ github.run_attempt }}
          path: |
            verification/p9-three-view-lazy/
            verification/p10-release-upgrade/backup-safety/
            /tmp/math-smoke-http.log
          if-no-files-found: warn

  targeted:
    name: targeted (${{ matrix.script }})
    needs: plan-checks
    if: ${{ needs.plan-checks.outputs.run_targeted == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan-checks.outputs.targeted_matrix) }}
    env:
      MATH_TARGET_SCRIPT: ${{ matrix.script }}
      MATH_TARGET_ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare genuine Chromium and verified Chinese font when needed
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          if ! fc-list :lang=zh-cn family | grep -q .; then
            bash .github/ci-probes/install-cjk-font.sh
            fc-cache -f
          fi
          fc-list :lang=zh-cn family | grep -q .
      - name: Run impacted math family in Chromium
        shell: bash
        run: |
          python3 -m http.server 43827 --directory dist > /tmp/math-targeted-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:43827/ >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then cat /tmp/math-targeted-http.log; exit 1; fi
          node scripts/ci-targeted-checks.mjs run
      - name: Preserve only a small, SHA-bound family receipt in routine checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-result-${{ matrix.id }}-attempt-${{ github.run_attempt }}
          path: verification/targeted-results/*.json
          if-no-files-found: error
      - name: Save full family evidence only for investigation on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-failure-${{ matrix.id }}-attempt-${{ github.run_attempt }}
          path: |
            verification/
            /tmp/math-targeted-http.log
          if-no-files-found: warn

  browser:
    name: browser (${{ matrix.group }})
    needs: static-checks
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.static-checks.outputs.browser_matrix) }}
    env:
      MATH_BROWSER_REQUIRED: ${{ matrix.group == 'p10-offline' && needs.static-checks.outputs.run_offline || needs.static-checks.outputs.run_browser }}
      MATH_BROWSER_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate group identity and browser scope
        id: group_config
        run: node scripts/required-browser-checks.mjs prepare "$MATH_BROWSER_GROUP"

      # The corresponding diagnostic probe passed on two fresh ubuntu-24.04 runners:
      # https://github.com/runlinx-eng/math/actions/runs/44514144125
      # Keep the original commands, conditional CJK fallback and 35-minute job cap.
      # Separate timing is necessary because the 35-minute attempt #44480305187
      # was cancelled after Chromium download, without identifying the hang.
      - name: Record browser runner image
        if: env.MATH_BROWSER_REQUIRED == 'true'
        run: |
          printf 'image=%s version=%s arch=%s\n' "$ImageOS" "$ImageVersion" "$RUNNER_ARCH"

      - name: Install Playwright (timed)
        if: env.MATH_BROWSER_REQUIRED == 'true'
        run: python3 .github/ci-probes/time-runtime-step.py npm-playwright npm install --no-save --no-package-lock playwright@1.56.1

      - name: Install Chromium (timed)
        if: env.MATH_BROWSER_REQUIRED == 'true'
        run: python3 .github/ci-probes/time-runtime-step.py chromium npx playwright install chromium

      - name: Detect Chinese fonts (timed)
        id: chinese_fonts
        if: env.MATH_BROWSER_REQUIRED == 'true'
        run: |
          python3 .github/ci-probes/time-runtime-step.py font-detection bash -e -c '
            if fc-list :lang=zh-cn family | grep -q .; then
              echo "present=true" >> "$GITHUB_OUTPUT"
            else
              echo "present=false" >> "$GITHUB_OUTPUT"
            fi
          '

      # The immutable, versioned binary is accepted only after checking the
      # official Ubuntu size and SHA-256. Cache corruption is always rejected.
      - name: Restore immutable CJK package cache
        if: env.MATH_BROWSER_REQUIRED == 'true' && steps.chinese_fonts.outputs.present == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.cache/math-tree/fonts-wqy-microhei_0.2.0-beta-3.1_all.deb
          key: wqy-ubuntu24-0.2.0-beta-3.1-58d0a29af79ce1fc5c63b4276065f0fce27decf6839835f3f9c2e68d9f84ca20-v1

      - name: Install Chinese font fallback (timed)
        if: env.MATH_BROWSER_REQUIRED == 'true' && steps.chinese_fonts.outputs.present == 'false'
        run: python3 .github/ci-probes/time-runtime-step.py cjk-font bash .github/ci-probes/install-cjk-font.sh

      - name: Rebuild font cache (timed)
        if: env.MATH_BROWSER_REQUIRED == 'true' && steps.chinese_fonts.outputs.present == 'false'
        run: python3 .github/ci-probes/time-runtime-step.py font-cache fc-cache -f

      - name: Verify Chinese font (timed)
        id: browser_runtime
        if: env.MATH_BROWSER_REQUIRED == 'true'
        run: |
          python3 .github/ci-probes/time-runtime-step.py font-verification bash -e -c '
            fc-list :lang=zh-cn family | grep -q . || { echo "Missing CJK fonts"; exit 1; }
            fc-match -f "CI CJK fallback: %{family} [%{file}]\n" "sans-serif:lang=zh-cn"
          '

      - name: Run every browser command in this group
        shell: bash
        run: |
          if [[ "$MATH_BROWSER_REQUIRED" == true ]]; then
            diag_dir=verification/runner-diagnostics
            mkdir -p "$diag_dir"
            diag_file="$diag_dir/${MATH_BROWSER_GROUP}-attempt-${GITHUB_RUN_ATTEMPT}.txt"
            {
              printf "group=%s run_id=%s attempt=%s sha=%s\n" "$MATH_BROWSER_GROUP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA"
              date -u +"started_at=%Y-%m-%dT%H:%M:%SZ"
              uname -a
              lscpu | grep -E "Model name|CPU\\(s\\)|Thread|Core|Socket" || true
              free -b || true
              df -B1 / || true
              node --version || true
              npm --version || true
              npx playwright --version || true
            } > "$diag_file" 2>&1
            capture_metrics() {
              printf "\\n--- sample %s ---\\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              printf "loadavg: "; cat /proc/loadavg 2>/dev/null || true
              printf "proc_stat: "; sed -n "1p" /proc/stat 2>/dev/null || true
              for metric in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpu.stat /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.events /proc/pressure/cpu /proc/pressure/memory /proc/pressure/io; do
                if [[ -r "$metric" ]]; then printf "%s: " "$metric"; tr "\\n" " " < "$metric"; printf "\\n"; fi
              done
              ps -eo pid,ppid,pcpu,pmem,etime,stat,comm --sort=-pcpu 2>/dev/null | head -n 12 || true
            }
            capture_metrics >> "$diag_file" 2>&1
            (while true; do sleep 30; capture_metrics; done) >> "$diag_file" 2>&1 &
            diag_sampler_pid=$!
            python3 -m http.server 43827 --directory dist > /tmp/math-http.log 2>&1 &
            browser_server_pid=$!
            trap 'kill "$browser_server_pid" 2>/dev/null || true; wait "$browser_server_pid" 2>/dev/null || true; kill "$diag_sampler_pid" 2>/dev/null || true; wait "$diag_sampler_pid" 2>/dev/null || true' EXIT
            ready=false
            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:43827/ >/dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 1
            done
            if [[ "$ready" != true ]]; then
              cat /tmp/math-http.log
              echo "Local preview server did not become ready."
              exit 1
            fi
          fi
          node scripts/required-browser-checks.mjs run "$MATH_BROWSER_GROUP"

      - name: Preserve this group's browser screenshots and evidence
        if: ${{ always() && steps.group_config.outcome == 'success' && env.MATH_BROWSER_REQUIRED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: math-required-checks-browser-evidence-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            ${{ steps.group_config.outputs.artifact_paths }}
            verification/runner-diagnostics/${{ matrix.group }}-attempt-${{ github.run_attempt }}.txt
          if-no-files-found: error

      - name: Preserve this group's exact command results
        if: ${{ always() && steps.group_config.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: required-browser-result-${{ matrix.group }}-attempt-${{ github.run_attempt }}
          path: verification/required-browser-groups/*.json
          if-no-files-found: error

  required-checks:
    name: required-checks
    needs: [plan-checks, static-checks, browser, smoke-checks, targeted]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read the small group result artifacts
        if: needs.browser.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: required-browser-result-*
          merge-multiple: true
          path: verification/required-browser-results/
      - name: Read selected family receipts only when relevant
        if: needs.targeted.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: targeted-result-*
          merge-multiple: true
          path: verification/targeted-downloaded/
      - name: Require exact selected receipts or the entire manually requested inventory
        if: always()
        env:
          MATH_REQUIRED_NEEDS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            node scripts/required-browser-checks.mjs gate
          else
            node scripts/ci-targeted-checks.mjs gate
          fi
