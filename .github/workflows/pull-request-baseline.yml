name: Pull request required checks

on:
  pull_request:
  # Run the full gate again on the integrated SHA before publishing the preview.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same PR, without cancelling another PR or deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    name: static-checks
    outputs:
      run_browser: ${{ steps.scope.outputs.run_browser }}
    runs-on: ubuntu-24.04
    # Syntax, unit tests and source-derived audits keep their existing gates.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine whether browser regression is relevant
        id: scope
        run: node scripts/required-browser-checks.mjs scope

      - name: Check patch whitespace and merge markers
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
          if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )' -- ':!docs/history/**'; then
            echo "Unresolved merge-conflict markers found"
            exit 1
          fi

      - name: Check runtime module syntax
        run: |
          node --check scripts/required-browser-checks.mjs
          node --check dist/spatial-scene.js
          node --check dist/spatial-relationship.js
          node --check dist/spatial-model.js
          node --check dist/space.js
          node --check dist/exploration.js
          node --check dist/learning/trail-priority.js
          node --check tests/p6b-layout-browser.cjs
          node --check tests/p11-focus-hover-browser.cjs
          node --check tests/p11-entry-simplification-browser.cjs
          node --check tests/p7-learning-panel-browser.cjs
          node --check dist/import-conflicts.js
          node --check dist/learning/learn.js
          node --check dist/learning/state.js
          node --check tests/p10-learning-continuity-browser.cjs
          node --check tests/p10-longterm-offline-browser.cjs
          node --check tests/p10-release-upgrade-browser.cjs
          node --check tests/p10-release-upgrade-repeat.cjs
          node --check dist/sw.js
          node --check dist/sw-client.js
          node --check tests/p10-sw-nav-isolation-browser.cjs
          node --check tests/p10-full-lessons-browser.cjs
          node --check tests/p10-backup-safety-browser.cjs
          node --check dist/learning/sequence-evidence.js
          node --check dist/learning/counterexample-evidence.js
          node --check dist/learning/fraction-evidence.js
          node --check dist/learning/place-evidence.js
          node --check tests/p9-place-adapter-browser.cjs
          node --check tests/p9-decimal-place-adapter-browser.cjs
          node --check tests/p9-mature-expansion-browser.cjs
          node --check dist/learning/unitwalk-evidence.js
          node --check dist/learning/groupwalk-evidence.js
          node --check dist/learning/route-evidence.js
          node --check tests/p9-route-adapter-browser.cjs
          node --check dist/learning/angle-evidence.js
          node --check tests/p9-angle-adapter-browser.cjs
          node --check dist/learning/transform-evidence.js
          node --check tests/p9-transform-adapter-browser.cjs
          node --check dist/learning/groups-evidence.js
          node --check tests/p9-groups-adapter-browser.cjs
          node --check dist/learning/fraction-order-evidence.js
          node --check tests/p9-fraction-order-adapter-browser.cjs
          node --check dist/learning/fraction-operations-evidence.js
          node --check tests/p9-fraction-operations-adapter-browser.cjs
          node --check tests/p9-numeric-compat-browser.cjs
          node --check dist/learning/evidence-contract.js
          node --check dist/learning/evidence-adapters.js
          node --check scripts/fraction-evidence-fixture.mjs
          node --check tests/p9-fraction-adapter-browser.cjs
          node --check tests/p9-unitwalk-adapter-browser.cjs
          node --check tests/p9-groupwalk-adapter-browser.cjs
          node --check tests/p9-counterexample-adapter-browser.cjs
          node --check dist/learning/line-evidence.js
          node --check tests/p9-line-adapter-browser.cjs
          node --check dist/learning/array-evidence.js
          node --check dist/learning/thinking-feedback.js
          node --check tests/p9-sequence-adapter-browser.cjs
          node --check tests/p9-array-adapter-browser.cjs
          node --check tests/p9-thinking-feedback-browser.cjs
          node --check tests/p9-geometry-thinking-browser.cjs
          node --check tests/p9-sequence-thinking-browser.cjs
          node --check dist/learning/p3-workflow.js
          node --check dist/learning/p3-view.js
          node --check dist/learning/workspace-flow.js
          node --check scripts/audit-learning-task-rules.mjs
          node --check tests/learning-node-runtime-browser.cjs
          node --check tests/three-level-node-progress-browser.cjs
          node --check tests/explore-during-learning-browser.cjs
          node --check dist/spatial-focus-filter.js
          node --check dist/grade-progression-model.js
          node --check dist/grade-node-filter.js
          node --check dist/grade-distribution.js
          node --check dist/grade-distribution-view.js
          node --check scripts/build_grade_progression_data.mjs
          node --check scripts/build_grade_panorama_lite.mjs
          node scripts/build_grade_panorama_lite.mjs --check

      - name: Run active Node.js unit and invariant tests
        shell: bash
        run: |
          test_files=(
            tests/spatial-relationship.test.mjs
            tests/spatial-overview.test.mjs
            tests/spatial-overview-structure.test.mjs
            tests/spatial-focus-filter.test.mjs
            tests/spatial-exploration.test.mjs
            tests/deployment-static.test.mjs
            tests/required-browser-checks.test.mjs
            tests/grade-progression-model.test.mjs
            tests/grade-progression-overview.test.mjs
            tests/grade-node-filter.test.mjs
            tests/grade-distribution.test.mjs
            tests/p3-learning-flow.test.mjs
            tests/p7-learning-panel.test.mjs
            tests/p7-learning-workspace-flow.test.mjs
            tests/p7-d6-learning-contract.test.mjs
            tests/p7-d7-task-adapters.test.mjs
            tests/thinking-feedback.test.mjs
            tests/p9-sequence-evidence-adapter.test.mjs
            tests/p9-counterexample-evidence-adapter.test.mjs
            tests/p9-fraction-evidence-adapter.test.mjs
            tests/p9-place-evidence-adapter.test.mjs
            tests/p9-decimal-place-evidence-adapter.test.mjs
            tests/p9-unitwalk-evidence-adapter.test.mjs
            tests/p9-groupwalk-evidence-adapter.test.mjs
            tests/p9-route-evidence-adapter.test.mjs
            tests/p9-angle-evidence-adapter.test.mjs
            tests/p9-transform-evidence-adapter.test.mjs
            tests/p9-groups-evidence-adapter.test.mjs
            tests/p9-fraction-order-evidence-adapter.test.mjs
            tests/p9-fraction-operations-evidence-adapter.test.mjs
            tests/p9-numeric-compat.test.mjs
            tests/p10-numeric-save-races.test.mjs
            tests/p9-evidence-contract.test.mjs
            tests/p9-mature-expansion.test.mjs
            tests/p9-line-evidence-adapter.test.mjs
            tests/p9-array-evidence-adapter.test.mjs
            tests/thinking-source-map.test.mjs
            tests/p8-runtime-boundary.test.mjs
            tests/p7-d5-entry-decision.test.mjs
            tests/p7-d3-capability-inventory.test.mjs
            tests/p4-learning-reliability.test.mjs
            tests/p5-integration-safety.test.mjs
            tests/p10-learning-continuity.test.mjs
            tests/p10-sw-retirement.test.mjs
            tests/p6b-trail-priority.test.mjs
          )

          for candidate in \
            tests/concept-explanations.test.mjs \
            tests/concept-review-regressions.test.mjs \
            tests/content-plan.test.mjs \
            tests/spatial-guide.test.mjs \
            tests/concept-coverage-consistency.test.mjs \
            tests/concept-review-inventory.test.mjs \
            tests/concept-sample-deep-review.test.mjs \
            tests/language-terms.test.mjs \
            tests/navigation-copy.test.mjs \
            tests/node-name-audit.test.mjs \
            tests/relationship-wording.test.mjs
          do
            if [[ -f "$candidate" ]]; then
              test_files+=("$candidate")
            fi
          done

          node --test "${test_files[@]}"
          node scripts/audit-learning-nodes.mjs
          node --test tests/learning-node-audit.test.mjs
          node scripts/audit-learning-task-rules.mjs
          node --test tests/learning-task-rules.test.mjs
          node scripts/build_p7_d3_inventory.mjs
          node scripts/build_p7_d7_coverage.mjs

      - name: Audit native interaction types and mathematics evidence (read-only)
        run: |
          node --check scripts/audit-learning-evidence.mjs
          node --test tests/learning-evidence-audit.test.mjs
          node scripts/audit-learning-evidence.mjs
          node --check scripts/audit-evidence-expansion.mjs
          node --check tests/evidence-expansion-audit.test.mjs
          node --test tests/evidence-expansion-audit.test.mjs
          node scripts/audit-evidence-expansion.mjs
          node --check scripts/audit-interaction-semantics.mjs
          node --test tests/interaction-semantic-audit.test.mjs
          node scripts/audit-interaction-semantics.mjs

      - name: Archive evidence audit source-derived report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-evidence-audit-${{ github.run_attempt }}
          path: verification/learning-evidence-audit/
          if-no-files-found: warn

      - name: Check deployment script syntax
        run: bash -n scripts/deploy-vps.sh scripts/rollback-vps.sh

      - name: Preserve Node audit and inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-required-checks-node-evidence-${{ github.run_attempt }}
          path: |
            verification/learning-node-audit/
            verification/p7-d3/
            verification/p7-d7/coverage.json
          if-no-files-found: warn

  browser:
    name: browser (${{ matrix.group }})
    needs: static-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [ui, evidence-core, evidence-place, evidence-expansion, evidence-expansion-2, p10, p8-performance]
    env:
      MATH_BROWSER_REQUIRED: ${{ needs.static-checks.outputs.run_browser }}
      MATH_BROWSER_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate group identity and browser scope
        id: group_config
        run: node scripts/required-browser-checks.mjs prepare "$MATH_BROWSER_GROUP"

      - name: Install isolated Chromium test runtime
        id: browser_runtime
        if: env.MATH_BROWSER_REQUIRED == 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          # Keep the existing runner, browser and CJK font requirements.
          npx playwright install chromium
          if ! fc-list :lang=zh-cn family | grep -q .; then
            sudo apt-get update -qq -o Acquire::Retries=3
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-noto-cjk
            fc-cache -f >/dev/null
          fi
          fc-list :lang=zh-cn family | grep -q . || { echo "Missing CJK fonts"; exit 1; }

      - name: Run every browser command in this group
        shell: bash
        run: |
          if [[ "$MATH_BROWSER_REQUIRED" == true ]]; then
            python3 -m http.server 43827 --directory dist > /tmp/math-http.log 2>&1 &
            browser_server_pid=$!
            trap 'kill "$browser_server_pid" 2>/dev/null || true' EXIT
            ready=false
            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:43827/ >/dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 1
            done
            if [[ "$ready" != true ]]; then
              cat /tmp/math-http.log
              echo "Local preview server did not become ready."
              exit 1
            fi
          fi
          node scripts/required-browser-checks.mjs run "$MATH_BROWSER_GROUP"

      - name: Preserve this group's browser screenshots and evidence
        if: ${{ always() && steps.group_config.outcome == 'success' && env.MATH_BROWSER_REQUIRED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: math-required-checks-browser-evidence-${{ matrix.group }}-${{ github.run_attempt }}
          path: ${{ steps.group_config.outputs.artifact_paths }}
          if-no-files-found: error

      - name: Preserve this group's exact command results
        if: ${{ always() && steps.group_config.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: required-browser-result-${{ matrix.group }}-attempt-${{ github.run_attempt }}
          path: verification/required-browser-groups/*.json
          if-no-files-found: error

  required-checks:
    name: required-checks
    needs: [static-checks, browser]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read the small group result artifacts
        if: needs.browser.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: required-browser-result-*
          merge-multiple: true
          path: verification/required-browser-results/
      - name: Require every applicable check and complete group inventory
        if: always()
        env:
          MATH_REQUIRED_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/required-browser-checks.mjs gate
