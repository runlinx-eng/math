name: Pull request required checks

on:
  pull_request:
  # Run the full gate again on the integrated SHA before publishing the preview.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same PR, without cancelling another PR or deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  required-checks:
    name: required-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine whether browser regression is relevant
        id: scope
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "run_browser=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")"
          if grep -Eq '^(dist/|tests/(spatial-(overview|focus|guide|relationship|theme|local).*|grade-progression-overview-browser.*|learning-workspace.*|concept-visual.*|node-name.*|relationship-wording.*)|docs/spatial-learning/INTERACTION-RULES\.md$|docs/language/|\.github/workflows/(pull-request-baseline|overview-readability-check)\.yml$)' <<< "$changed_files"; then
            echo "run_browser=true" >> "$GITHUB_OUTPUT"
            echo "Browser regression is required for this change."
          else
            echo "run_browser=false" >> "$GITHUB_OUTPUT"
            echo "Browser regression is not relevant to the changed files."
          fi

      - name: Check patch whitespace and merge markers
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
          if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )' -- ':!docs/history/**'; then
            echo "Unresolved merge-conflict markers found"
            exit 1
          fi

      - name: Check runtime module syntax
        run: |
          node --check dist/spatial-scene.js
          node --check dist/spatial-relationship.js
          node --check dist/spatial-model.js
          node --check dist/space.js
          node --check dist/exploration.js
          node --check dist/learning/trail-priority.js
          node --check tests/p6b-layout-browser.cjs
          node --check tests/p7-learning-panel-browser.cjs
          node --check dist/import-conflicts.js
          node --check dist/learning/learn.js
          node --check dist/learning/p3-workflow.js
          node --check dist/learning/p3-view.js
          node --check dist/learning/workspace-flow.js
          node --check dist/spatial-focus-filter.js
          node --check dist/grade-progression-model.js
          node --check dist/grade-node-filter.js
          node --check dist/grade-distribution.js
          node --check dist/grade-distribution-view.js
          node --check scripts/build_grade_progression_data.mjs
          node --check scripts/build_grade_panorama_lite.mjs
          node scripts/build_grade_panorama_lite.mjs --check

      - name: Run active Node.js unit and invariant tests
        shell: bash
        run: |
          test_files=(
            tests/spatial-relationship.test.mjs
            tests/spatial-overview.test.mjs
            tests/spatial-overview-structure.test.mjs
            tests/spatial-focus-filter.test.mjs
            tests/spatial-exploration.test.mjs
            tests/deployment-static.test.mjs
            tests/grade-progression-model.test.mjs
            tests/grade-progression-overview.test.mjs
            tests/grade-node-filter.test.mjs
            tests/grade-distribution.test.mjs
            tests/p3-learning-flow.test.mjs
            tests/p7-learning-panel.test.mjs
            tests/p7-learning-workspace-flow.test.mjs
            tests/p7-d6-learning-contract.test.mjs
            tests/p7-d7-task-adapters.test.mjs
            tests/p8-runtime-boundary.test.mjs
            tests/p7-d5-entry-decision.test.mjs
            tests/p7-d3-capability-inventory.test.mjs
            tests/p4-learning-reliability.test.mjs
            tests/p5-integration-safety.test.mjs
            tests/p6b-trail-priority.test.mjs
          )

          for candidate in \
            tests/concept-explanations.test.mjs \
            tests/concept-review-regressions.test.mjs \
            tests/content-plan.test.mjs \
            tests/spatial-guide.test.mjs \
            tests/concept-coverage-consistency.test.mjs \
            tests/concept-review-inventory.test.mjs \
            tests/concept-sample-deep-review.test.mjs \
            tests/language-terms.test.mjs \
            tests/navigation-copy.test.mjs \
            tests/node-name-audit.test.mjs \
            tests/relationship-wording.test.mjs
          do
            if [[ -f "$candidate" ]]; then
              test_files+=("$candidate")
            fi
          done

          node --test "${test_files[@]}"
          node scripts/build_p7_d3_inventory.mjs
          node scripts/build_p7_d7_coverage.mjs

      - name: Check deployment script syntax
        run: bash -n scripts/deploy-vps.sh scripts/rollback-vps.sh

      - name: Install isolated Chromium test runtime
        if: steps.scope.outputs.run_browser == 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run browser regression suite
        if: steps.scope.outputs.run_browser == 'true'
        shell: bash
        run: |
          python3 -m http.server 43827 --directory dist > /tmp/math-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:43827/ >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "$ready" != true ]]; then
            cat /tmp/math-http.log
            echo "Local preview server did not become ready."
            exit 1
          fi

          for test_file in \
            tests/p7-d5-entry-browser.cjs \
            tests/p7-d6-fixed-ui-browser.cjs \
            tests/p7-d7-multi-type-browser.cjs \
            tests/p8-node-surface-browser.cjs \
            tests/p8-trail-performance-browser.cjs \
            tests/p8-mode-real-click-browser.cjs \
            tests/p8-b39-lazy-browser.cjs \
            tests/p1-navigation-browser.cjs \
            tests/p2-grade-distribution-browser.cjs \
            tests/p3-learning-flow-browser.cjs \
            tests/p7-learning-panel-browser.cjs \
            tests/p7-d4-multi-type-browser.cjs \
            tests/p4-learning-reliability-browser.cjs \
            tests/p5-integration-browser.cjs \
            tests/continuous-space-browser.cjs \
            tests/p6b-layout-browser.cjs \
            tests/spatial-overview-browser.cjs \
            tests/spatial-focus-transition-browser.cjs \
            tests/spatial-focus-semantics-browser.cjs \
            tests/spatial-focus-filter-browser.cjs \
            tests/spatial-guide-inplace-browser.cjs \
            tests/spatial-unified-map-browser.cjs \
            tests/spatial-theme-overview-browser.cjs \
            tests/grade-progression-overview-browser.cjs \
            tests/spatial-local-focus-browser.cjs \
            tests/learning-workspace-browser.cjs \
            tests/concept-visual-browser.cjs \
            tests/node-name-browser.cjs \
            tests/relationship-wording-browser.cjs
          do
            if [[ -f "$test_file" ]]; then
              echo "::group::${test_file}"
              if [[ "$test_file" == "tests/concept-visual-browser.cjs" ]]; then
                MATH_CONCEPT_BROWSER_SCOPE=smoke node "$test_file"
              else
                if [[ "$test_file" == "tests/p8-trail-performance-browser.cjs" ]]; then
                  MATH_P8_BASELINE=1 node "$test_file"
                fi
                node "$test_file"
              fi
              echo "::endgroup::"
            fi
          done

      - name: Preserve browser screenshots and verification evidence
        if: always() && steps.scope.outputs.run_browser == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: math-required-checks-browser-evidence
          path: |
            verification/overview-readability-v1/
            verification/spatial-focus-transition/
            verification/spatial-focus-semantics/
            verification/spatial-focus-filter/
            verification/spatial-guide-inplace/
            verification/spatial-unified-map/
            verification/spatial-theme-overview/
            verification/grade-progression-overview/
            verification/learning-workspace/
            verification/concept-language-pilot/
            verification/node-name-review/
            verification/language-direction/
            verification/p1-navigation/
            verification/p2-grade-distribution/
            verification/p3-learning-flow/
            verification/p7-learning-panel/
            verification/p7-d3/
            verification/p7-d4/
            verification/p7-d5/
            verification/p7-d6/
            verification/p7-d7/
            verification/p8-node-surfaces/
            verification/p8-trail-performance/
            verification/p8-mode-clicks/
            verification/p4-learning-reliability/
            verification/p5-integration/
            verification/continuous-space/
            verification/p6b-layout/
          if-no-files-found: warn
