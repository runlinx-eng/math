name: Pull request required checks

on:
  pull_request:
  # Main integration uses lightweight checks; full regression is milestone-triggered on demand.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same PR, without cancelling another PR or deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan-checks:
    name: plan-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_targeted: ${{ steps.target_plan.outputs.run_targeted }}
      run_smoke: ${{ steps.target_plan.outputs.run_smoke }}
      targeted_matrix: ${{ steps.target_plan.outputs.targeted_matrix }}
      targeted_digest: ${{ steps.target_plan.outputs.targeted_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select impacted browser families from exact source diff
        id: target_plan
        run: node scripts/ci-targeted-checks.mjs plan

  static-checks:
    name: static-checks
    outputs:
      run_browser: ${{ steps.scope.outputs.run_browser }}
      run_offline: ${{ steps.scope.outputs.run_offline }}
      browser_matrix: ${{ steps.live_browser_matrix.outputs.browser_matrix }}
    runs-on: ubuntu-24.04
    # Syntax, unit tests and source-derived audits keep their existing gates.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine whether browser regression is relevant
        id: scope
        run: node scripts/required-browser-checks.mjs scope

      - name: Plan safe Node test scope from actual changed files
        id: node_scope
        run: node scripts/ci-node-scope.mjs output

      - name: Check patch whitespace and merge markers
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
          if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )' -- ':!docs/history/**'; then
            echo "Unresolved merge-conflict markers found"
            exit 1
          fi

      - name: Enforce standard viewport for new browser test entrypoints
        run: |
          node --check scripts/check-new-browser-viewports.mjs
          node --check tests/helpers/standard-desktop-viewport.cjs
          node --check tests/desktop-viewport-policy.test.mjs
          node scripts/check-new-browser-viewports.mjs

      - name: Check runtime module syntax
        run: |
          node --check scripts/required-browser-checks.mjs
          node --check scripts/ci-node-scope.mjs
          node --check scripts/ci-targeted-checks.mjs
          node --check scripts/ci-audit-viewports.mjs
          node --check tests/ci-audit-viewports.test.mjs
          node --check dist/spatial-scene.js
